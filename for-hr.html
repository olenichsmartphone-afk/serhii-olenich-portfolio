<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For HR | Serhii Olenich</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#fafaf9;color:#202623;font:1rem/1.6 system-ui,sans-serif}
.wrap {width:min(100% - 2rem, 54rem);margin:0 auto;padding:2rem 0 4rem}
a {color:#245348;text-underline-offset:.17em;overflow-wrap:anywhere}
a:focus-visible,button:focus-visible {outline:2px solid #245348;outline-offset:4px}
nav {display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-bottom:2rem}
h1,h2,h3 {line-height:1.2}
h1 {font-size:clamp(2rem,6vw,3.25rem);margin:0 0 .65rem}
h2 {font-size:1.6rem;margin:2.25rem 0 1rem}
p {margin:.5rem 0 1rem}

main {max-width:44rem}
.recruiter-card {display:block;width:100%;height:auto;border-radius:12px}
.recruiter-tools {display:flex;flex-wrap:wrap;gap:.55rem 1rem;align-items:center;margin-top:.9rem}
button {font:inherit;color:white;background:#245348;border:0;border-radius:.4rem;padding:.5rem .8rem;cursor:pointer}
.recruiter-prompt {font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}

</style>
</head>
<body><div class="wrap">
<nav aria-label="Main navigation"><a href="./">Portfolio</a><a href="cv.html">Short CV</a><a href="cv-full.html">Full CV</a><a href="for-hr.html">For HR</a></nav>
<main><h1>For HR</h1><p class="recruiter-help">Drag the card into your AI assistant.</p><img class="recruiter-card" src="hr-card.png" width="1440" height="410" alt="Compare this portfolio and CV with our open roles. https://olenichsmartphone-afk.github.io/serhii-olenich-portfolio/portfolio-text.html" draggable="true">
<div class="recruiter-tools"><button class="button" type="button" data-copy-recruiter>Copy prompt</button><span class="recruiter-status" role="status"></span></div>
<pre class="recruiter-prompt" hidden>Compare this portfolio and CV with our open roles.
https://olenichsmartphone-afk.github.io/serhii-olenich-portfolio/portfolio-text.html</pre></main></div>
<script>
function setupRecruiterCopy(container) {
  const prompt = container.querySelector(".recruiter-prompt");
  const status = container.querySelector(".recruiter-status");
  container.querySelector("[data-copy-recruiter]").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(prompt.textContent);
      status.textContent = "Copied.";
    } catch {
      prompt.hidden = false;
      const range = document.createRange();
      range.selectNodeContents(prompt);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      status.textContent = "Press Ctrl+C or Command+C to copy.";
    }
  });
}
setupRecruiterCopy(document);</script>
</body></html>
